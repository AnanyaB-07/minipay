<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      text-align: center;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 80%;
      max-width: 400px;
    }
    button {
      background-color: #0078D4;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #005A9E;
    }
    #qrcode {
      margin-top: 20px;
    }
    .nav-link {
      display: block;
      margin-top: 30px;
      font-size: 16px;
      color: #0078D4;
      text-decoration: none;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <input type="text" id="qrInput" placeholder="Enter UPI link or any text" />
  <button onclick="generateQR()">Generate QR Code</button>
  <div id="qrcode"></div>

  <!-- Link back to your banking app -->
  <a href="https://ananyb10.github.io/mybanking-app/" class="nav-link">← Back to MyBanking App</a>

  <script>
    function generateQR() {
      const input = document.getElementById("qrInput").value;
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = ""; // Clear previous QR
      new QRCode(qrContainer, {
        text: input,
        width: 200,
        height: 200
      });
    }
  </script>
</body>
</html>
